<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple mode - LED controller</title>
    <!-- request CSS from the ESP8266 web server -->
    <link rel="stylesheet" href="css/bootstrap.min.css?v=2">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="icon" href="images/rgb.png">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-3">
        <div class="container">
            <a class="navbar-brand" href="/"><img src="/images/rgb.png" alt="Home" width="24" height="24"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">LED controller</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/simple.htm">Simple mode</a></li>
                    <li class="nav-item"><a class="nav-link" href="/multi.htm">Discovery & Sync</a></li>
                    <li class="nav-item"><a class="nav-link" href="/edit.htm">Filesystem editor</a></li>
                    <li class="nav-item"><a class="nav-link" href="/update.htm">Firmware & Wi-Fi</a></li>
                    <li class="nav-item"><a class="nav-link" href="/info.htm">Information</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com/ArtursGailis1995/esp8266-fastled-webserver" title="GitHub"><img src="/images/github.ico" alt="GitHub" height="16"></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="container" class="container">
        <div class="row">
            <div class="col-sm-3">
                <div class="card mb-3">
                    <div class="card-header">Power options</div>
                    <div class="card-body">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary" id="btnOn">On</button>
                            <button type="button" class="btn btn-outline-primary" id="btnOff">Off</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-9">
                <div class="card mb-3">
                    <div class="card-header">Brightness control</div>
                    <div class="card-body">
                        <div id="brightnessSliderRow"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Pattern selection</div>
            <div class="card-body">
                <div id="patternGrid" class="d-flex flex-wrap gap-2"></div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Color selection</div>
            <div class="card-body">
                <div id="colorButtonsRow" class="d-flex flex-wrap"></div>
            </div>
        </div>
    </div>

    <div id="templates" class="d-none">
        <div id="colorButtonTemplate" class="grid-item-color" role="button"></div>
        <button id="patternButtonTemplate" type="button" class="grid-item-pattern btn btn-outline-primary"></button>
        <div id="numberTemplate" class="row align-items-center">
            <div class="col-4 col-sm-2">
                <input class="form-control input" type="number" step="1" min="0" max="255">
            </div>
            <div class="col-8 col-sm-10">
                <input class="form-range slider" type="range" step="1" min="0" max="255">
            </div>
        </div>
    </div>

    <!-- request js from the ESP8266 web server -->
    <script src="js/jquery.min.js?v=2"></script>
    <script src="js/bootstrap.bundle.min.js?v=2"></script>
    <script src="js/r-websocket.min.js?v=2"></script>
    <script src="js/simple.js?v=2"></script>
</body>
</html>
