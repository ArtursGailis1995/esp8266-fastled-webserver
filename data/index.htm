<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LED controller</title>
    <!-- request CSS from the ESP8266 web server -->
    <link rel="stylesheet" href="css/bootstrap.min.css?v=3">
    <link rel="stylesheet" href="css/jquery.minicolors.css?v=3">
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="icon" href="images/rgb.png">
    <script src="js/common.js?v=3"></script>
</head>

<body class="has-bottom-bar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-3">
        <div class="container">
            <a class="navbar-brand" href="/"><img src="/images/rgb.png" alt="Home" width="24" height="24"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">LED controller</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simple.htm">Simple mode</a></li>
                    <li class="nav-item"><a class="nav-link" href="/multi.htm">Discovery & Sync</a></li>
                    <li class="nav-item"><a class="nav-link" href="/edit.htm">Filesystem editor</a></li>
                    <li class="nav-item"><a class="nav-link" href="/update.htm">Firmware & Wi-Fi</a></li>
                    <li class="nav-item"><a class="nav-link" href="/info.htm">Information</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button type="button" class="nav-link" id="btnTheme" title="Switch light / dark theme" aria-label="Switch light or dark theme">
                            <svg class="icon icon-sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg>
                            <svg class="icon icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/></svg>
                        </button>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com/ArtursGailis1995/esp8266-fastled-webserver" title="GitHub"><img src="/images/github.ico" alt="GitHub" height="16"></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="container" class="container">
        <div class="card mb-3">
            <div class="card-header">LED controller</div>
            <div class="card-body">
                <form id="form" onsubmit="return false;"></form>
            </div>
        </div>
    </div>

    <div id="templates" class="d-none">
        <div id="sectionTemplate" class="row">
            <div class="col-12">
                <hr class="my-2">
            </div>
        </div>

        <div id="numberTemplate" class="row mb-3 align-items-center">
            <label class="col-sm-3 col-lg-2 col-form-label control-label"></label>
            <div class="col-5 col-sm-3 col-lg-2">
                <div class="input-group">
                    <input class="form-control input" type="number" step="1" min="0" max="255">
                    <span class="input-group-text unit d-none"></span>
                </div>
            </div>
            <div class="col-7 col-sm-6 col-lg-8">
                <input class="form-range slider" type="range" step="1" min="0" max="255">
            </div>
        </div>

        <div id="booleanTemplate" class="row mb-3 align-items-center">
            <label class="col-sm-3 col-lg-2 col-form-label control-label"></label>
            <div class="col-sm-9 col-lg-10">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" id="btnOn">On</button>
                    <button type="button" class="btn btn-outline-primary" id="btnOff">Off</button>
                </div>
            </div>
        </div>

        <div id="selectTemplate" class="row mb-3 align-items-center">
            <label class="col-sm-3 col-lg-2 col-form-label control-label"></label>
            <div class="col">
                <select class="form-select"></select>
            </div>
            <div class="col-auto">
                <div class="btn-group" role="group" aria-label="Previous or next">
                    <button type="button" class="btn btn-outline-secondary btn-previous" aria-label="Previous" title="Previous">
                        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/></svg>
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-next" aria-label="Next" title="Next">
                        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="colorPaletteTemplate" class="row mb-3 align-items-center">
            <label class="col-sm-3 col-lg-2 col-form-label control-label color-label"></label>
            <div class="col-sm-9 col-lg-10">
                <div class="btn-group w-100" role="group" aria-label="Color presets">
                    <button type="button" class="btn btn-color" style="background-color: #FF0000;" title="Red" aria-label="Red"></button>
                    <button type="button" class="btn btn-color" style="background-color: #FF8000;" title="Orange" aria-label="Orange"></button>
                    <button type="button" class="btn btn-color" style="background-color: #FFFF00;" title="Yellow" aria-label="Yellow"></button>
                    <button type="button" class="btn btn-color" style="background-color: #80FF00;" title="Chartreuse" aria-label="Chartreuse"></button>
                    <button type="button" class="btn btn-color" style="background-color: #00FF00;" title="Green" aria-label="Green"></button>
                    <button type="button" class="btn btn-color" style="background-color: #00FF80;" title="Spring Green" aria-label="Spring Green"></button>
                    <button type="button" class="btn btn-color" style="background-color: #00FFFF;" title="Cyan" aria-label="Cyan"></button>
                    <button type="button" class="btn btn-color" style="background-color: #0080FF;" title="Azure" aria-label="Azure"></button>
                    <button type="button" class="btn btn-color" style="background-color: #0000FF;" title="Blue" aria-label="Blue"></button>
                    <button type="button" class="btn btn-color" style="background-color: #8000FF;" title="Violet" aria-label="Violet"></button>
                    <button type="button" class="btn btn-color" style="background-color: #FF00FF;" title="Magenta" aria-label="Magenta"></button>
                    <button type="button" class="btn btn-color" style="background-color: #FF0080;" title="Rose" aria-label="Rose"></button>
                    <button type="button" class="btn btn-color" style="background-color: #FFFFFF;" title="White" aria-label="White"></button>
                </div>
            </div>
        </div>

        <div id="colorTemplate">
            <div class="row mb-3">
                <div class="col-sm-9 col-lg-10 offset-sm-3 offset-lg-2">
                    <input type="text" class="form-control minicolors">
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-lg-2 col-form-label">Red</label>
                <div class="col-5 col-sm-3 col-lg-2">
                    <input class="form-control color-red-input" type="number" step="1" min="0" max="255">
                </div>
                <div class="col-7 col-sm-6 col-lg-8">
                    <input class="form-range color-red-slider" type="range" step="1" min="0" max="255">
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-lg-2 col-form-label">Green</label>
                <div class="col-5 col-sm-3 col-lg-2">
                    <input class="form-control color-green-input" type="number" step="1" min="0" max="255">
                </div>
                <div class="col-7 col-sm-6 col-lg-8">
                    <input class="form-range color-green-slider" type="range" step="1" min="0" max="255">
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-lg-2 col-form-label">Blue</label>
                <div class="col-5 col-sm-3 col-lg-2">
                    <input class="form-control color-blue-input" type="number" step="1" min="0" max="255">
                </div>
                <div class="col-7 col-sm-6 col-lg-8">
                    <input class="form-range color-blue-slider" type="range" step="1" min="0" max="255">
                </div>
            </div>
        </div>

        <div id="stringTemplate" class="row mb-3 align-items-center">
            <label class="col-sm-3 col-lg-2 col-form-label control-label"></label>
            <div class="col-sm-9 col-lg-10">
                <input class="form-control input">
            </div>
        </div>

        <div id="labelTemplate" class="row mb-3 align-items-center">
            <label class="col-sm-3 col-lg-2 col-form-label control-label"></label>
            <div class="col-sm-9 col-lg-10">
                <input class="form-control input" readonly>
            </div>
        </div>
    </div>

    <nav class="navbar fixed-bottom navbar-dark bg-primary">
        <div class="container justify-content-start">
            <a class="nav-link text-white me-3" href="/" aria-label="Refresh" title="Refresh">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg>
            </a>
            <span class="navbar-text" id="status">Loading, please wait...</span>
        </div>
    </nav>

    <!-- request js from the ESP8266 web server -->
    <script src="js/jquery.min.js?v=3"></script>
    <script src="js/bootstrap.bundle.min.js?v=3"></script>
    <script src="js/jquery.minicolors.min.js?v=3"></script>
    <script src="js/r-websocket.min.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
